    <circle cx="42" cy="68" r="2.5" fill="#FFFFFF"/>
    <circle cx="50" cy="68" r="2.5" fill="#FFFFFF"/>

    <!-- 'R' Shape -->
    <path d="M 52 16 C 55 16 60 16 65 16 C 85 16 100 28 100 49 C 100 66 88 78 72 81 L 95 105 C 98 108 96 112 91 112 L 74 112 C 71 112 68 110 66 108 L 48 87 C 46 85 48 81 51 81 L 64 81 C 74 81 82 74 82 62 C 82 50 74 43 64 43 L 45 43 C 42 43 40 41 41 38 L 49 21 C 50 18 51 16 52 16 Z" fill="#1E293B"/>
  </g>

  <!-- Autorevio Text -->
  <text x="125" y="80" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="800" font-size="52" letter-spacing="-1">
