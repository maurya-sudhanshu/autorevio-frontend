    <g fill="#F59E0B" transform="translate(54, 2)">
      <polygon points="5,0 6.5,3 9.8,3.5 7.4,5.8 8,9.1 5,7.5 2,9.1 2.6,5.8 0.2,3.5 3.5,3" transform="translate(0,0)"/>
